  </defs>
  <rect width="1200" height="420" rx="28" fill="#171b31"/>
  <path d="M182 212 350 125 518 212 686 125 854 212 1022 125M350 125v174l168-87m0 0 168 87 168-87v174" fill="none" stroke="url(#line)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
  <g filter="url(#shadow)" font-family="monospace" font-size="22" font-weight="700" text-anchor="middle">
