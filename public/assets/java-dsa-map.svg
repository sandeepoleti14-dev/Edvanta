<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Java DSA learning paths</title>
  <desc id="desc">Colorful connected nodes represent arrays, trees, graphs, and dynamic programming.</desc>
