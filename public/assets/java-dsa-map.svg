    <g><circle cx="350" cy="125" r="62" fill="#3c74e8"/><text x="350" y="133" fill="white">O(log N)</text></g>
    <g><circle cx="518" cy="212" r="62" fill="#1caa91"/><text x="518" y="220" fill="white">TREES</text></g>
    <g><circle cx="686" cy="125" r="62" fill="#8a60dd"/><text x="686" y="133" fill="white">GRAPHS</text></g>
    <g><circle cx="854" cy="212" r="62" fill="#d18138"/><text x="854" y="220" fill="white">HEAPS</text></g>
    <g><circle cx="1022" cy="125" r="62" fill="#168caa"/><text x="1022" y="133" fill="white">DP</text></g>
    <g><circle cx="350" cy="299" r="42" fill="#26304c"/><text x="350" y="307" fill="#b7c5ff">JAVA</text></g>
    <g><circle cx="686" cy="299" r="42" fill="#26304c"/><text x="686" y="307" fill="#b7c5ff">BFS</text></g>
    <g><circle cx="1022" cy="299" r="42" fill="#26304c"/><text x="1022" y="307" fill="#b7c5ff">DFS</text></g>
