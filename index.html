<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#F6F7FC" id="edvanta-theme-color" />
    <title>EDVANTA — Java DSA Learning Platform</title>
    <meta
      name="description"
      content="Learn Smarter. Grow Further. EDVANTA is an AI-powered Java DSA learning platform with adaptive practice, misconception analysis, and personalized revision."
    />
    <meta property="og:title" content="EDVANTA — Java DSA Learning Platform" />
    <meta
      property="og:description"
      content="Learn Java data structures and algorithms with adaptive practice, reasoning-based feedback, and spaced repetition."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Nunito:wght@500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('edvanta_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = saved === 'dark' || saved === 'light' ? saved : (prefersDark ? 'dark' : 'light');
          var root = document.documentElement;
          if (resolved === 'dark') {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
            var meta = document.getElementById('edvanta-theme-color');
            if (meta) meta.setAttribute('content', '#111322');
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F6F7FC] dark:bg-[#111322] text-[#14172B] dark:text-[#F4F6FF] antialiased selection:bg-[#7055F7]/20 selection:text-[#14172B] dark:selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
